name: Build Android APK

on:
  workflow_dispatch:      # 手动触发
  push:
    tags:
      - 'apk-v*'          # 或推 tag apk-v1.0.0 触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 不用 ArtemSBulgakov/buildozer-action（其 Dockerfile 无法解析
      # kivy/buildozer 多平台 OCI 镜像，issue #41，已长期无人维护），
      # 直接用官方镜像 docker run 构建。
      # 失败时重跑一次打印日志尾（镜像 ENTRYPOINT 已是 buildozer，
      # 重跑只需在命令前加 -v 调日志级别）。
      - name: Build APK (official kivy/buildozer image)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/android_app":/home/user/hostcwd \
            ghcr.io/kivy/buildozer:latest \
            -v android debug 2>&1 | tee /tmp/build.log || {
              echo "::warning::build failed, dumping last 150 log lines"
              tail -150 /tmp/build.log
              exit 1
            }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: biliresellmonitor-apk
          path: android_app/bin/*.apk
          if-no-files-found: error
